<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>LLM Chat App</title>
		<style>
			:root {
				/* Warna Khas Neobrutalism */
				--bg-main: #f3f0ca;        /* Kuning pucat/krem khas koran lama */
				--primary-color: #ffde4d;   /* Kuning neon kontras */
				--accent-user: #ff8aae;     /* Pink kontras untuk User */
				--accent-ai: #a3ffd6;       /* Hijau mint kontras untuk AI */
				--text-dark: #000000;       /* Hitam pekat absolut */
				--border-thick: 4px;        /* Border tebal ciri khas utama */
				--neo-shadow: 5px 5px 0px #000000; /* Shadow mentah tanpa blur */
				--neo-shadow-sm: 3px 3px 0px #000000;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family: "Impact", "Arial Black", -apple-system, sans-serif;
				background-color: var(--bg-main);
				color: var(--text-dark);
				max-width: 800px;
				margin: 0 auto;
				padding: 2rem 1rem;
			}

			header {
				text-align: left;
				margin-bottom: 2rem;
				padding: 1.5rem;
				background-color: var(--primary-color);
				border: var(--border-thick) solid var(--text-dark);
				box-shadow: var(--neo-shadow);
				transform: rotate(-1deg); /* Efek miring khas brutalism */
			}

			h1 {
				font-size: 2.5rem;
				text-transform: uppercase;
				letter-spacing: -1px;
				-webkit-text-stroke: 1px var(--text-dark);
			}

			header p {
				font-family: 'Courier New', Courier, monospace;
				font-weight: bold;
				margin-top: 0.5rem;
			}

			/* Komponen Tambahan: Status Bar */
			.status-bar {
				display: flex;
				gap: 1rem;
				margin-bottom: 1.5rem;
				font-family: monospace;
				font-weight: bold;
			}

			.status-badge {
				background: white;
				padding: 0.25rem 0.75rem;
				border: 2px solid var(--text-dark);
				box-shadow: var(--neo-shadow-sm);
			}

			.chat-container {
				display: flex;
				flex-direction: column;
				height: calc(100vh - 280px);
				min-height: 450px;
				border: var(--border-thick) solid var(--text-dark);
				background-color: #ffffff;
				box-shadow: var(--neo-shadow);
				position: relative;
			}

			.chat-messages {
				flex: 1;
				overflow-y: auto;
				padding: 1.5rem;
				background-color: #ffffff;
				display: flex;
				flex-direction: column;
				gap: 1.5rem;
			}

			.message {
				padding: 1rem;
				border: 3px solid var(--text-dark);
				max-width: 85%;
				font-family: 'Arial', sans-serif;
				font-weight: 700;
				position: relative;
			}

			.message p {
				white-space: pre-line;
				margin: 0;
				overflow-wrap: anywhere;
			}

			.user-message {
				background-color: var(--accent-user);
				align-self: flex-end;
				margin-left: auto;
				box-shadow: -4px 4px 0px #000000; /* Shadow mengarah ke kiri bawah */
			}

			.assistant-message {
				background-color: var(--accent-ai);
				align-self: flex-start;
				box-shadow: 4px 4px 0px #000000;
			}

			/* Tambahan label pengirim biar makin asik */
			.user-message::before {
				content: "YOU :";
				font-family: monospace;
				display: block;
				font-size: 0.75rem;
				margin-bottom: 0.25rem;
				text-decoration: underline;
			}

			.assistant-message::before {
				content: "AI_WORKER :";
				font-family: monospace;
				display: block;
				font-size: 0.75rem;
				margin-bottom: 0.25rem;
				text-decoration: underline;
			}

			.message-input {
				display: flex;
				padding: 1rem;
				border-top: var(--border-thick) solid var(--text-dark);
				background-color: var(--primary-color);
				gap: 0.5rem;
			}

			#user-input {
				flex: 1;
				padding: 0.75rem;
				border: 3px solid var(--text-dark);
				font-family: 'Arial', sans-serif;
				font-weight: bold;
				resize: none;
				min-height: 50px;
				background: #ffffff;
			}

			#user-input:focus {
				outline: none;
				background-color: #fff9e6;
			}

			#send-button {
				padding: 0 2rem;
				background-color: var(--accent-user);
				color: var(--text-dark);
				border: 3px solid var(--text-dark);
				font-weight: 900;
				text-transform: uppercase;
				cursor: pointer;
				box-shadow: var(--neo-shadow-sm);
				transition: transform 0.1s, box-shadow 0.1s;
			}

			#send-button:hover {
				transform: translate(-2px, -2px);
				box-shadow: 5px 5px 0px #000000;
			}

			#send-button:active {
				transform: translate(2px, 2px);
				box-shadow: 1px 1px 0px #000000;
			}

			#send-button:disabled {
				background-color: #d1d5db;
				color: #9ca3af;
				cursor: not-allowed;
				transform: none;
				box-shadow: none;
			}

			.typing-indicator {
				display: none;
				font-family: monospace;
				font-weight: bold;
				background-color: #000000;
				color: #00ff00; /* Warna retro terminal hacking */
				padding: 0.5rem 1rem;
				border-top: 3px solid var(--text-dark);
			}

			.typing-indicator.visible {
				display: block;
			}

			footer {
				margin-top: 2rem;
				text-align: center;
				font-size: 0.9rem;
				font-family: monospace;
				font-weight: bold;
				text-transform: uppercase;
			}
		</style>
	</head>
	<body>
		<header>
			<h1>Cloudflare AI Chat</h1>
			<p>Powered by Cloudflare Workers AI</p>
		</header>

		<div class="status-bar">
			<div class="status-badge">MODEL: LLM-LOCAL</div>
			<div class="status-badge" style="background: var(--accent-ai)">ONLINE</div>
		</div>

		<div class="chat-container">
			<div id="chat-messages" class="chat-messages">
				<div class="message assistant-message">
					<p>
						Hello! I'm an LLM chat app powered by Cloudflare Workers AI. How can
						I help you today?
					</p>
				</div>
			</div>

			<div class="typing-indicator" id="typing-indicator">
				_> AI_IS_THINKING...
			</div>

			<div class="message-input">
				<textarea
					id="user-input"
					placeholder="Type your message here..."
					rows="1"
					autofocus
				></textarea>
				<button id="send-button">Send ➔</button>
			</div>
		</div>

		<footer>
			<p>SYS.TEMPLATE // CORE_V.2026 // NO RIGHTS RESERVED</p>
		</footer>

		<script src="chat.js"></script>
	</body>
</html>
